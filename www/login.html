<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HotelVIP — Ingreso</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg-body:     #0f1117;
      --bg-card:     #1e2535;
      --bg-input:    #161e2e;
      --border:      rgba(255,255,255,.07);
      --accent:      #3b82f6;
      --accent-hover:#2563eb;
      --text:        #e2e8f0;
      --text-muted:  rgba(226,232,240,.5);
      --text-faint:  rgba(226,232,240,.3);
      --red:         #ef4444;
      --radius:      10px;
      --radius-sm:   6px;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-body);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo animado */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 25s linear infinite;
    }
    @keyframes gridMove { to { background-position: 40px 40px; } }

    /* Estrellas */
    .star {
      position: fixed; background: #fff; border-radius: 50%;
      animation: twinkle var(--d, 3s) var(--del, 0s) ease-in-out infinite;
      z-index: 0; pointer-events: none;
    }
    @keyframes twinkle { 0%,100% { opacity:.08 } 50% { opacity:.65 } }

    /* Card */
    .login-card {
      position: relative; z-index: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      width: 420px;
      max-width: 96vw;
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 36px;
    }
    .logo-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--accent), #1d4ed8);
      border-radius: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 30px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 8px 24px rgba(59,130,246,.3);
    }
    .logo h1 {
      font-size: 22px; font-weight: 700; color: var(--text);
      letter-spacing: -.5px;
    }
    .logo h1 span { color: var(--accent); }
    .logo p {
      font-size: 12px; color: var(--text-faint); margin-top: 5px;
    }

    /* Form */
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 11px; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .06em;
      margin-bottom: 7px;
    }
    .form-group .input-wrap {
      position: relative;
    }
    .form-group .input-wrap i {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint); font-size: 13px;
      pointer-events: none;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px 12px 38px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text); font-size: 14px;
      outline: none;
      transition: border-color .2s, background .2s;
    }
    .form-group input:focus {
      border-color: var(--accent);
      background: rgba(59,130,246,.06);
    }
    .form-group input::placeholder { color: var(--text-faint); }

    /* Submit */
    .btn-login {
      width: 100%; padding: 13px;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 6px;
      transition: background .2s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-login:active:not(:disabled) { transform: scale(.99); }
    .btn-login:disabled { background: rgba(59,130,246,.4); cursor: not-allowed; }

    .btn-spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-msg {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.25);
      color: var(--red);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px; margin-top: 12px;
      display: none;
      align-items: center; gap: 8px;
    }
    .error-msg.visible { display: flex; }

    /* Footer */
    .login-footer {
      text-align: center; margin-top: 28px;
      font-size: 11px; color: var(--text-faint);
      line-height: 1.8;
    }
  </style>
</head>
<body>

<div class="bg-grid"></div>

<div class="login-card">
  <div class="logo">
    <div class="logo-icon">&#x1F3E8;</div>
    <h1>Hotel<span>VIP</span></h1>
    <p>Sistema de Gestion Hotelera &mdash; SistemasVIP</p>
  </div>

  <form id="formLogin" autocomplete="on">
    <div class="form-group" style="display:none">
      <label style="display:none">Schema</label>
      <div class="input-wrap" style="display:none">
        <i class="fa-solid fa-building"></i>
        <input type="text" id="inSchema" placeholder="hotel_001"
               value="hotel_001" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <div class="form-group">
      <label>Usuario</label>
      <div class="input-wrap">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="inUsuario" placeholder="admin"
               autocomplete="username" autofocus>
      </div>
    </div>

    <div class="form-group">
      <label>Contrasena</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="inPassword" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
               autocomplete="current-password">
      </div>
    </div>

    <button type="submit" class="btn-login" id="btnLogin">
      <i class="fa-solid fa-right-to-bracket" id="btnIcon"></i>
      <span id="btnTexto">Ingresar</span>
      <div class="btn-spinner" id="spinner"></div>
    </button>

    <div class="error-msg" id="errorMsg">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="errorTxt"></span>
    </div>
  </form>

  <div class="login-footer">
    SistemasVIP &copy; 2026 &mdash; Cusco, Per&#xFA;<br>
    HotelVIP v1.0 &mdash; Auth + Habitaciones
  </div>
</div>

<div id="toast-container" style="position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;"></div>

<script src="js/core/api.js"></script>
<script>
// Estrellas decorativas
(function() {
  for (let i = 0; i < 110; i++) {
    const d = document.createElement('div');
    d.className = 'star';
    const s = Math.random() * 2 + 0.4;
    d.style.cssText = `width:${s}px;height:${s}px;`
      + `left:${Math.random()*100}%;top:${Math.random()*100}%;`
      + `--d:${2 + Math.random()*5}s;--del:${Math.random()*5}s`;
    document.body.appendChild(d);
  }
})();

// Si ya tiene sesion, redirigir directo
if (api._token) window.location.href = 'recepcion.html';

// El servidor sabe cual es su base; la pantalla se la pregunta al cargar.
// Antes el schema iba escrito a mano en cada copia de este archivo, y bastaba
// copiar el del central sobre un tenant para dejarlo apuntando a la base
// equivocada ("SELECT command denied ... hotel_001.seg_usuarios").
// Si /health no contesta, queda el valor del archivo y no se rompe nada.
(async function tomarSchemaDelServidor() {
  try {
    const r = await fetch('/health', { cache: 'no-store' });
    const j = await r.json();
    if (j && j.schema) document.getElementById('inSchema').value = j.schema;
    if (j && j.hotel)  document.title = j.hotel + ' — Ingreso';
  } catch (e) { /* sin servidor: se usa lo que ya tenia el campo */ }
})();

document.getElementById('formLogin').addEventListener('submit', async function(e) {
  e.preventDefault();

  const schema   = document.getElementById('inSchema').value.trim();
  const usuario  = document.getElementById('inUsuario').value.trim();
  const password = document.getElementById('inPassword').value;
  const errorDiv = document.getElementById('errorMsg');
  const errorTxt = document.getElementById('errorTxt');
  const btnLogin = document.getElementById('btnLogin');
  const btnTexto = document.getElementById('btnTexto');
  const btnIcon  = document.getElementById('btnIcon');
  const spinner  = document.getElementById('spinner');

  // Validacion basica
  if (!usuario || !password) {
    errorTxt.textContent = 'Ingrese usuario y contrasena';
    errorDiv.classList.add('visible');
    return;
  }

  // Estado cargando
  errorDiv.classList.remove('visible');
  btnLogin.disabled = true;
  btnTexto.textContent = 'Ingresando...';
  btnIcon.style.display = 'none';
  spinner.style.display = 'block';

  try {
    const res = await fetch(location.origin + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, contrasena: password, schema })
    });
    const data = await res.json();

    if (!data.success) throw new Error(data.error || 'Credenciales incorrectas');

    // Guardar sesion
    api.setAuth(data.data.token, data.data.schema);
    localStorage.setItem('hv_usuario', JSON.stringify({
      id:        data.data.idUsuario,
      nombres:   data.data.nombres,
      apellidos: data.data.apellidos,
      rol:       data.data.rol,          // codigo: ADMIN, RECEPCION, ...
      rolNombre: data.data.rolNombre,    // nombre para mostrar
      modulos:   data.data.modulos,      // que puede ver este rol
      email:     data.data.email,
      foto:      data.data.foto,
      // Que hotel/sucursal es este: se muestra en la barra superior
      hotelNombre:    data.data.hotelNombre,
      hotelDireccion: data.data.hotelDireccion
    }));

    window.location.href = 'recepcion.html';

  } catch (err) {
    errorTxt.textContent = err.message;
    errorDiv.classList.add('visible');
    btnLogin.disabled = false;
    btnTexto.textContent = 'Ingresar';
    btnIcon.style.display = '';
    spinner.style.display = 'none';
    document.getElementById('inPassword').value = '';
    document.getElementById('inPassword').focus();
  }
});
</script>
</body>
</html>
